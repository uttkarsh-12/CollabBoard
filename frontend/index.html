<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabBoard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- SVG ICON LIBRARY -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="i-pen" viewBox="0 0 24 24">
        <path d="m12 19 7-7 3 3-7 7-3-3Z" />
        <path d="m18 13-3-3M2 22l5-1 12-12a2.1 2.1 0 0 0-3-3L4 18l-2 4Z" />
      </symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24">
        <path
          d="m7 21-5-5a2 2 0 0 1 0-3L13 2a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-9 10H7Z"
        />
        <path d="m22 21-7 0M7 21l7-7" />
      </symbol>
      <symbol id="i-rectangle" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" />
      </symbol>
      <symbol id="i-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
      </symbol>
      <symbol id="i-line" viewBox="0 0 24 24">
        <path d="M4 20 20 4" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14M13 5l7 7-7 7" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="M3 7v6h6M3 13a9 9 0 1 1 2.5 6.2" />
      </symbol>
      <symbol id="i-redo" viewBox="0 0 24 24">
        <path d="M21 7v6h-6M21 13a9 9 0 1 0-2.5 6.2" />
      </symbol>
      <symbol id="i-text" viewBox="0 0 24 24">
        <path d="M4 7V4h16v3M12 4v16M8 20h8" />
      </symbol>
      <symbol id="i-sticky" viewBox="0 0 24 24">
        <path d="M5 3h14v13l-5 5H5z" />
        <path d="M14 21v-5h5M8 8h8M8 12h5" />
      </symbol>
      <symbol id="i-select" viewBox="0 0 24 24">
        <path d="m5 3 14 11-7 1-3 6L5 3Z" />
      </symbol>
      <symbol id="i-delete" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-clear" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6" />
      </symbol>
      <symbol id="i-board" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <path d="M8 8h8M8 12h8M8 16h4" />
      </symbol>
    </svg>

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <h1>CollabBoard</h1>
        <span class="board-name">Untitled Board</span>
      </div>

      <span class="status">Offline mode</span>
    </header>

    <main class="workspace">
      <!-- TOOLBAR -->
      <section class="toolbar">
        <div class="tool-group">
          <button id="penBtn" class="tool-btn active" title="Pen">
            <svg><use href="#i-pen" /></svg>
          </button>
          <button id="eraserBtn" class="tool-btn" title="Eraser">
            <svg><use href="#i-eraser" /></svg>
          </button>

          <div class="tool-setting">
            <label for="colorPicker">Color</label>
            <input type="color" id="colorPicker" value="#000000" />
          </div>

          <div class="tool-setting">
            <label for="brushSize">Size</label>
            <input type="range" id="brushSize" min="1" max="30" value="3" />
          </div>
        </div>

        <div class="tool-group">
          <button id="rectBtn" class="tool-btn" title="Rectangle">
            <svg><use href="#i-rectangle" /></svg>
          </button>
          <button id="circleBtn" class="tool-btn" title="Circle">
            <svg><use href="#i-circle" /></svg>
          </button>
          <button id="lineBtn" class="tool-btn" title="Line">
            <svg><use href="#i-line" /></svg>
          </button>
          <button id="arrowBtn" class="tool-btn" title="Arrow">
            <svg><use href="#i-arrow" /></svg>
          </button>
        </div>

        <div class="tool-group">
          <button id="undoBtn" class="tool-btn" title="Undo">
            <svg><use href="#i-undo" /></svg>
          </button>
          <button id="redoBtn" class="tool-btn" title="Redo">
            <svg><use href="#i-redo" /></svg>
          </button>
          <button id="textBtn" class="tool-btn" title="Add text">
            <svg><use href="#i-text" /></svg>
          </button>
          <button id="stickyBtn" class="tool-btn" title="Sticky note">
            <svg><use href="#i-sticky" /></svg>
          </button>
          <button id="selectBtn" class="tool-btn" title="Select">
            <svg><use href="#i-select" /></svg>
          </button>
          <button
            id="deleteBtn"
            class="tool-btn danger-btn"
            title="Delete selected"
          >
            <svg><use href="#i-delete" /></svg>
          </button>
        </div>

        <div class="tool-group view-group">
          <button id="zoomOutBtn" class="tool-btn" title="Zoom out">
            <svg><use href="#i-minus" /></svg>
          </button>
          <span id="zoomLevel">100%</span>
          <button id="zoomInBtn" class="tool-btn" title="Zoom in">
            <svg><use href="#i-plus" /></svg>
          </button>
          <button
            id="resetZoomBtn"
            class="tool-btn reset-view"
            title="Reset view"
          >
            <svg><use href="#i-reset" /></svg>
          </button>
        </div>

        <div class="tool-group board-group">
          <button
            id="clearBtn"
            class="tool-btn danger-btn"
            title="Clear canvas"
          >
            <svg><use href="#i-clear" /></svg>
          </button>
          <button
            id="resetBoardBtn"
            class="tool-btn danger-btn"
            title="Reset saved board"
          >
            <svg><use href="#i-board" /></svg>
          </button>
        </div>
      </section>

      <!-- CANVAS -->
      <div class="canvas-container">
        <canvas id="whiteboard"></canvas>
      </div>
    </main>

    <script src="js/canvas.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
